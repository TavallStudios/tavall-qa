version: 2
source:
  repository: TavallStudios/tavall-qa
  provider: github
build:
  type: gradle
  java: 25
  gradle: 9.6.1
resources:
  mode: SYSTEM
requiredChecks:
  - compilation
  - unit-tests
  - quality
checks:
  compilation:
    executor: gradle
    tasks:
      - :tavall-qa-cli:classes
    networkMode: ISOLATED
  unit-tests:
    executor: gradle
    tasks:
      - :tavall-qa-cli:test
    networkMode: ISOLATED
  quality:
    executor: gradle
    tasks:
      - :tavall-qa-cli:check
    networkMode: ISOLATED
dependencies:
  - kind: artifact
    identity: tavall-public-maven-mirror
    role: MAVEN_MIRROR
    selector: sha256
    digest: 8c106128dae3edada19c1362f9b971d36093a937c7b424bd08284357c244ef9c
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
    digest: e047172ab7c2be005baf0b2c4b46e230ead78417
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
    substitutions: 'org.tavall:tavall-logging=:'
  - kind: source
    identity: TavallStudios/tavall-custom-enum-java
    role: SHARED_DEP
    selector: required-source
    digest: 2284168910f755a0d13a68fbc821cedc14d0a49b
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
    substitutions: 'org.tavall:tavall-custom-enum-java=:'
  - kind: source
    identity: TavallStudios/tavall-cli
    role: SHARED_DEP
    selector: required-source
    digest: 7cd8ac1ec367905b6d9dabf848e12e0fbe253755
    substitutions: 'org.tavall:tavall-cli-api=:tavall-cli-api,org.tavall:tavall-cli=:'
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
    digest: d16c1de2c205f3c72fe63cd5a2765c3b1bf55368
    sourceVersion: 1.0.0
    versionProperty: tavallDiVersion
    substitutions: 'org.tavall:tavall-di=:'
  - kind: source
    identity: TavallStudios/tavall-eventbus
    role: SHARED_DEP
    selector: required-source
    digest: 5458524247f5e757153c986222c1415b5beedb33
    substitutions: 'org.tavall:tavall-eventbus=:'
  - kind: source
    identity: TavallStudios/tavall-registry
    role: SHARED_DEP
    selector: required-source
    digest: 9ff6c035769eae79947efd4cf78dec1af0a09e3f
    substitutions: 'org.tavall:tavall-registry=:'
  - kind: source
    identity: TavallStudios/tavall-concurrency
