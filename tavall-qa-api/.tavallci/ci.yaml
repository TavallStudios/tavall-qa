version: 2

source:
  repository: TavallStudios/tavall-qa
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

requiredChecks:
  - compilation
  - quality

checks:
  compilation:
    executor: gradle
    tasks:
      - :tavall-qa-api:classes
  quality:
    executor: gradle
    tasks:
      - :tavall-qa-api:check
