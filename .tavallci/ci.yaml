version: 2

source:
  repository: TavallStudios/tavall-web-qa
  provider: github

build:
  type: gradle
  java: 25
  gradle: 9.6.1

resources:
  mode: SYSTEM

dependencies:
  - kind: source
    identity: TavallStudios/tavall-web
    role: SHARED_DEP
    selector: required-source
    digest: 1fc12f26a0a1d98aadd049a74d8bc0afb8b410d3
    pluginId: org.tavall.web.frontend
    pluginVersion: "0.1.1-SNAPSHOT"
    versionProperty: tavallWebVersion
    pluginProjectPath: :tavall-web-frontend-gradle
    substitutions: "org.tavall:tavall-web-api=:tavall-web-api,org.tavall:tavall-web-frontend=:tavall-web-frontend,org.tavall:tavall-web-frontend-codegen=:tavall-web-frontend-codegen"
  - kind: source
    identity: TavallStudios/tavall-qa
    role: SHARED_DEP
    selector: required-source
    digest: 516a77c21d06c6ac9c98511edcadd5a9fa1c213d
    substitutions: "org.tavall:tavall-qa-api=:tavall-qa-api"

requiredChecks:
  - compilation
  - unit-tests
  - quality

checks:
  compilation:
    executor: gradle
    tasks:
      - classes
  unit-tests:
    executor: gradle
    tasks:
      - test
  quality:
    executor: gradle
    tasks:
      - check
