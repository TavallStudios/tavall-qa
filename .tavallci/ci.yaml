version: 2
source:
  repository: TavallStudios/tavall-qa
  provider: github
build:
  type: gradle
  java: 25
  gradle: 9.6.1
resources:
  mode: SYSTEM
modules:
  - tavall-qa-api
  - tavall-qa-cli
  - tavall-qa-system
  - tavall-qa-test-suite
  - tavall-qa-web-frontend
requiredChecks:
  - compilation
  - unit-tests
  - quality
  - integration
checks:
  compilation:
    executor: gradle
    tasks:
      - :tavall-qa-api:classes
      - :tavall-qa-cli:classes
      - :tavall-qa-system:classes
      - :tavall-qa-web-frontend:classes
    networkMode: ISOLATED
  unit-tests:
    executor: gradle
    tasks:
      - :tavall-qa-cli:test
      - :tavall-qa-test-suite:test
      - :tavall-qa-web-frontend:test
    networkMode: ISOLATED
  quality:
    executor: gradle
    tasks:
      - check
    networkMode: ISOLATED
  integration:
    executor: gradle
    tasks:
      - :tavall-qa-test-suite:executionCheckpointIntegrationTest
    networkMode: ISOLATED
dependencies:
  - kind: artifact
    identity: tavall-public-maven-mirror
    role: MAVEN_MIRROR
    selector: sha256
    digest: 8c106128dae3edada19c1362f9b971d36093a937c7b424bd08284357c244ef9c
  - kind: source
    identity: TavallStudios/tavall-logging
    role: SHARED_DEP
    selector: required-source
    digest: e047172ab7c2be005baf0b2c4b46e230ead78417
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
    substitutions: 'org.tavall:tavall-logging=:'
  - kind: source
    identity: TavallStudios/tavall-custom-enum-java
    role: SHARED_DEP
    selector: required-source
    digest: 2284168910f755a0d13a68fbc821cedc14d0a49b
    sourceVersion: 1.0.0
    versionProperty: tavallVersion
    substitutions: 'org.tavall:tavall-custom-enum-java=:'
  - kind: source
    identity: TavallStudios/tavall-filesystem
    role: SHARED_DEP
    selector: required-source
    digest: 398ab8b2afb49c4dacd865b31ba2980e78b71a51
    substitutions: 'org.tavall.filesystem:tavall-filesystem-api=:tavall-filesystem-api,org.tavall.filesystem:tavall-filesystem=:tavall-filesystem'
  - kind: source
    identity: TavallStudios/tavall-web
    role: SHARED_DEP
    selector: required-source
    digest: aa2f95a0bca7e82f144ac890078c6af1d9b26dd9
    pluginId: org.tavall.web.frontend
    pluginVersion: "0.1.1-SNAPSHOT"
    versionProperty: tavallWebVersion
    pluginProjectPath: :tavall-web-frontend-gradle
    substitutions: "org.tavall:tavall-web-api=:tavall-web-api,org.tavall:tavall-web-frontend=:tavall-web-frontend,org.tavall:tavall-web-frontend-codegen=:tavall-web-frontend-codegen"
  - kind: source
    identity: TavallStudios/tavall-cli
    role: SHARED_DEP
    selector: required-source
    digest: 7cd8ac1ec367905b6d9dabf848e12e0fbe253755
    substitutions: 'org.tavall:tavall-cli-api=:tavall-cli-api,org.tavall:tavall-cli=:'
  - kind: source
    identity: TavallStudios/tavall-di
    role: SHARED_DEP
    selector: required-source
    digest: d16c1de2c205f3c72fe63cd5a2765c3b1bf55368
    sourceVersion: 1.0.0
    versionProperty: tavallDiVersion
    substitutions: 'org.tavall:tavall-di=:'
  - kind: source
    identity: TavallStudios/tavall-eventbus
    role: SHARED_DEP
    selector: required-source
    digest: 5458524247f5e757153c986222c1415b5beedb33
    substitutions: 'org.tavall:tavall-eventbus=:'
  - kind: source
    identity: TavallStudios/tavall-registry
    role: SHARED_DEP
    selector: required-source
    digest: 9ff6c035769eae79947efd4cf78dec1af0a09e3f
    substitutions: 'org.tavall:tavall-registry=:'
  - kind: source
    identity: TavallStudios/tavall-concurrency
    role: SHARED_DEP
    selector: required-source
    digest: e5578a2ba6f5d2317400585569acc0c1f94c4444
    substitutions: 'org.tavall:tavall-concurrency=:'
